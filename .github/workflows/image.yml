# mobile-mcp-image
# - every push / PR builds linux/amd64, audits the image content and runs a smoke test (no phone needed)
# - only the main branch pushes to ghcr.io/mouse9527/mobile-mcp-image:sha-<short sha> (immutable; no latest)
# - third-party actions are pinned to commit SHAs
name: image

on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mouse9527/mobile-mcp-image

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: mobile-mcp-image:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # no keys / credentials / .git in the image; file list and hashes kept as an artifact
      - name: audit image content
        run: ./audit.sh mobile-mcp-image:ci audit

      # 401 without token, 33 tools, adb >= 37, uid 1000, no shell, telemetry off
      - name: smoke test
        run: ./smoke.sh mobile-mcp-image:ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-mcp-image-audit
          path: audit/
          retention-days: 90

      - name: tags
        id: meta
        run: echo "tags=${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
